name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: stats-release
    strategy:
      matrix:
        include:
          - count: 1
            label: "1"
          - count: 10
            label: "10"
          - count: 100
            label: "100"
          - count: 1000
            label: "1k"
          - count: 10000
            label: "10k"
          - count: 100000
            label: "100k"
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_STATS_READ_ROLE_ARN }}
          aws-region: us-east-1
      - name: Download aggregate stats
        run: |
          mkdir -p src/synthetic_edi_gen/data
          aws s3 cp --no-progress s3://covered-data-files/synthetic-edi-gen/stats.json src/synthetic_edi_gen/data/stats.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Generate synthetic data (${{ matrix.label }} records)
        run: uv run synthetic-edi-gen --count ${{ matrix.count }} --seed 42 --output-dir ./output

      - name: Create tarball
        run: tar --use-compress-program 'zstd -9' -cf synthetic-data-${{ matrix.label }}.tar.zst -C ./output .

      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" synthetic-data-${{ matrix.label }}.tar.zst
